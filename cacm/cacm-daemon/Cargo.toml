[package]
name = "cacm-daemon"
version = "0.1.0"
edition = "2021"
description = "HTTP + WebSocket daemon for the Cross-Agent Context Manager (CACM)"
license = "MIT"
publish = false

[[bin]]
name = "cacm-daemon"
path = "src/main.rs"

[dependencies]
# Core CACM types, watcher, and parser registry.
cacm-core = { path = "../cacm-core" }

# Async runtime + HTTP/WebSocket server.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization / protocol.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# CLI parsing.
clap = { version = "4", features = ["derive"] }

# Storage backends.
# SQLite fallback: `bundled` compiles SQLite from source (no system dependency).
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging + stream utilities for the WebSocket handler.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
futures-util = { version = "0.3", features = ["sink"] }
# Non-blocking file log sink (crashpad: collect logs for post-mortem).
tracing-appender = "0.2"

[dev-dependencies]
# Real WebSocket client for HTTP-layer integration tests (handshake 403/503,
# frame-size limits, end-to-end ping).
tokio-tungstenite = "0.24"
