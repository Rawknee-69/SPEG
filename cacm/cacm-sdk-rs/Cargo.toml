[package]
name = "cacm-sdk-rs"
version = "0.1.0"
edition = "2021"
description = "Rust SDK client for the CACM daemon (WebSocket JSON-RPC)"
license = "MIT"
publish = false

[dependencies]
# Core CACM wire types (AgentSession, CrossAgentContext, AgentType).
cacm-core = { path = "../cacm-core" }

# Async runtime + WebSocket client.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", features = ["sink"] }

# Serialization / protocol.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Test fixtures: entry timestamps and mock-daemon concurrency helpers.
chrono = { version = "0.4", features = ["serde"] }
