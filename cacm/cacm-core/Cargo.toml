[package]
name = "cacm-core"
version = "0.1.0"
edition = "2021"
description = "Core types, watcher infrastructure, and parser trait for the Cross-Agent Context Manager (CACM)"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
notify = "8"
